name: compose

# ops/ を変えたら、compose の構文とイメージの決まり (.github/scripts/check-images.py)、スクリプトの試験を確かめる
on:
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/scripts/**'
      - '.github/workflows/compose.yml'
  pull_request:
    paths:
      - 'ops/**'
      - '.github/scripts/**'
      - '.github/workflows/compose.yml'

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: スクリプトの構文と試験
        run: |
          # SC2034: lib.sh の変数は、source した側が使う
          shellcheck -S warning -e SC2034 -x ops/both-service/*.sh ops/toroserver/scripts/*.sh .github/scripts/*.sh
          bash .github/scripts/test-ops.sh
          python3 .github/scripts/test_fetch_plugins.py

      - name: イメージの決まり
        run: python3 .github/scripts/check-images.py ops/both-service/docker-compose.yaml

      - name: compose の構文
        working-directory: ops/both-service
        run: |
          # 秘密の env ファイルは git に入れないので、空のものを置く
          touch limbo.env
          docker compose config -q