name: ci

# 試験に通った JAR を、GHCR (ghcr.io/<owner>/<repo>、非公開) に置く。置くのは main へのプッシュとタグ (v*) のときだけ。プルリクエストは試験とビルドだけ
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: test and build
        run: gradle --no-daemon test shadowJar

      # 薄い JAR (-thin) ではなく、Kotlin を入れた JAR を使う
      - name: dist
        run: |
          mkdir dist
          cp "$(ls build/libs/TORO-Proxy-*.jar | grep -v -- '-thin')" dist/TORO-Proxy.jar
          ls -l dist

      # GHCR の名前は小文字だけ
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
